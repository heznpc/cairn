# Dependabot config — grouped minor/patch + isolated semver-major.
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Security updates always stay isolated so they merge fast.
    ignore:
      # zod stays on v3 — MCP SDK pins it as peer.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # @types/node tracks engines.node policy, not "latest". Bump manually.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    commit-message:
      prefix: "chore(ci)"
    groups:
      gh-actions:
        applies-to: version-updates
        patterns: ["*"]
